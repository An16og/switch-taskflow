# TaskFlow Triage Pair Room Template (Version 2)
#
# Deploys a collaborative two-agent workroom on Switch:
# 1. taskflow-triage: Ambient / high-recall classifier monitoring conversation
# 2. taskflow-worker: Autonomous deliverable drafting & Todoist action checklists
#
# Handoff occurs natively via Switch targeted room messages.

version: 2
params:
  room_name:
    type: string
    label: Room name
    description: The Switch room where tasks are ambiently triaged and autonomously executed.
    default: TaskFlow Operations
  bridge:
    type: bridge
    label: Messaging app
    description: Where the room is created (e.g. Slack workspace, or the server default app).
    default: [Slack, $first]
    required: false
  provider:
    type: provider
    description: The provider engine for the agents.
    default: [claude, codex, opencode, antigravity]
    input: advanced
  machine:
    type: machine
    description: Machine on which the agents run.
    default: [$first]
    input: advanced
  directory:
    type: directory
    description: Working directory for TaskFlow.
    default: "{$agents_dir}/switch-taskflow"
    input: advanced

form:
  advanced: { label: Advanced, open: false }

resources:
  triage_agent:
    type: agent
    name: taskflow-triage
    display_name: TaskFlow Triage
    description: >-
      Ambient high-recall task triage and intent classifier agent. Listens to room conversations,
      identifies actionable work vs human todos, and hands off execution to taskflow-worker via targeted room messages.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{directory}"
    addressing: anyone
    instructions: |
      You are TaskFlow Triage, the high-recall listening agent of TaskFlow.
      Your responsibility:
      1. Ambiently monitor conversations in the room.
      2. When an actionable task is detected (addressed to @taskflow / @taskflow-triage, or containing action triggers), classify it into AUTO_EXECUTE or HUMAN_TODO.
      3. Hand off the classified task to taskflow-worker via a targeted room message (@taskflow-worker).
      4. Never execute the task yourself; your sole duty is accurate, rapid triage and handoff.

  worker_agent:
    type: agent
    name: taskflow-worker
    display_name: TaskFlow Worker
    description: >-
      Autonomous task executor and action scaffolder. Receives task handoffs from taskflow-triage,
      drafts complete markdown deliverables, scaffolds 3-step action checklists, and syncs tasks to Todoist.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{directory}"
    addressing: anyone
    instructions: |
      You are TaskFlow Worker, the autonomous execution agent of TaskFlow.
      Your responsibility:
      1. Listen for targeted handoff messages from taskflow-triage.
      2. For AUTO_EXECUTE tasks: autonomously draft the requested deliverable (release notes, docs, bug analyses) and post directly to the room.
      3. For HUMAN_TODO tasks: scaffold a 3-step action checklist, create the task in Todoist with due dates, and reply to the requester with the targeted receipt.

  triage_room:
    type: room
    name: "{room_name}"
    description: >-
      Autonomous multi-agent task triage and execution workroom. Powered by TaskFlow Triage and TaskFlow Worker.
    channel_type: channel_public
    bridge: "{bridge}"
    agents: [triage_agent, worker_agent]
    users:
      - if: "{bridge}"
        value: ["{$creator}"]
      - value: []
    instructions: |
      This room is monitored by TaskFlow, an autonomous multi-agent workroom pair.

      ### 1. What TaskFlow Does:
      - taskflow-triage: Ambiently monitors conversation streams, extracts actionable tasks, and determines autonomy level.
      - taskflow-worker: Receives targeted handoffs to either autonomously draft knowledge deliverables or scaffold human action plans with Todoist sync.

      ### 2. Autonomy Thresholds:
      - AUTO_EXECUTE (Auto-Draft): For self-contained knowledge creation (release notes, docs, bug analyses, postmortems). No external authority needed; deliverable is drafted directly into the room.
      - HUMAN_TODO (Ask a Human): For production deployments, DB maintenance, security audits, or approvals. Scaffolds a 3-step action checklist, syncs to Todoist with natural due dates, and sends a targeted receipt to the assignee.

      ### 3. Where Artifacts Go:
      - Knowledge Deliverables: Broadcast directly as formatted Markdown in the room or thread.
      - Human Action Tasks: Synced to Todoist API v1 with interactive checklist in description and receipt link in chat.

      ### 4. Special Jobs:
      - Say "@taskflow-triage triage this channel" to trigger a full channel triage job analyzing the recent backlog.
    kickoff: >-
      @taskflow-triage ambient listener is active. @taskflow-worker is online.
      Direct tasks to @taskflow-triage or mention actionable items in chat.
