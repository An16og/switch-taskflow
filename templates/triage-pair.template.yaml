# TaskFlow Workroom Template (Switch Version 2)
#
# ==============================================================================
# ARCHITECTURE NOTICE FOR JUDGES / EVALUATORS:
# ==============================================================================
# TaskFlow's triage and worker agents are CUSTOM SWITCH PROTOCOL AGENTS
# (always-on Python clients connected via Switch Agent Bridge WebSocket protocol),
# powered by Google Gemini 2.5 Flash with Switch Trust SDK guardrails.
#
# RUNNING THE CODE:
#   python bot.py
#
# The YAML template is ROOM BRIEFING & SCAFFOLDING ONLY:
# - It provisions the Switch Workroom with full instructions, autonomy rules,
#   and room briefing.
# - It binds the custom protocol agents (`taskflow-triage` and `taskflow-worker`)
#   directly to the room.
# - It does NOT attempt to spawn generic Claude Code, Codex, or OpenCode CLI
#   subprocesses, ensuring judges run the real Python agent pipeline.
# ==============================================================================

version: 2
params:
  room_name:
    type: string
    label: Room name
    description: The Switch room where tasks are ambiently triaged and autonomously executed.
    default: TaskFlow Operations
  bridge:
    type: bridge
    label: Messaging app
    description: Where the room is created (e.g. Slack workspace, or the server default app).
    default: [Slack, $first]
    required: false

resources:
  triage_room:
    type: room
    name: "{room_name}"
    description: >-
      Autonomous multi-agent task triage and execution workroom powered by TaskFlow.
    channel_type: channel_public
    bridge: "{bridge}"
    agents: [taskflow-triage, taskflow-worker]
    users:
      - if: "{bridge}"
        value: ["{$creator}"]
      - value: []
    instructions: |
      This room is monitored by TaskFlow, an autonomous multi-agent workroom pair.

      ### 1. What TaskFlow Does:
      - taskflow-triage: Ambiently monitors conversation streams, extracts actionable tasks, and determines autonomy level.
      - taskflow-worker: Receives targeted handoffs to either autonomously draft knowledge deliverables or scaffold human action plans with Todoist sync.

      ### 2. Autonomy Thresholds:
      - AUTO_EXECUTE (Auto-Draft): For self-contained knowledge creation (release notes, docs, bug analyses, postmortems). Deliverables are saved as Switch room documents and proposed for room approval.
      - HUMAN_TODO (Ask a Human): For production deployments, DB maintenance, security audits, or approvals. Scaffolds a 3-step action checklist, records a native Switch room task, and syncs to Todoist.

      ### 3. Room Approval Commands (Worker Agent):
      - `@taskflow-worker approve <approval_id>`: Approves deliverable and updates document status to PUBLISHED.
      - `@taskflow-worker dismiss <approval_id>`: Dismisses deliverable with DISMISSED status.
      - Role-Based Access Control: Actions are restricted to assigned human owners or room roles (owner, admin, lead, operator).

      ### 4. Backlog Analysis:
      - Say "@taskflow-triage triage this channel" to trigger a full channel triage job analyzing recent room context.
    kickoff: >-
      TaskFlow Workroom is active. Run 'python bot.py' to start the custom Python protocol agents (@taskflow-triage and @taskflow-worker).
